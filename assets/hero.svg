<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-label="FerrumKV hero">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="brand-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="380" rx="16" fill="#0f172a"/>

  <!-- Subtle hex grid -->
  <g opacity="0.04" stroke="#6366f1" stroke-width="1" fill="none">
    <polygon points="80,60 110,77 110,111 80,128 50,111 50,77"/>
    <polygon points="200,40 230,57 230,91 200,108 170,91 170,57"/>
    <polygon points="320,60 350,77 350,111 320,128 290,111 290,77"/>
    <polygon points="440,40 470,57 470,91 440,108 410,91 410,57"/>
    <polygon points="560,60 590,77 590,111 560,128 530,111 530,77"/>
    <polygon points="680,40 710,57 710,91 680,108 650,91 650,57"/>
    <polygon points="800,60 830,77 830,111 800,128 770,111 770,77"/>
    <polygon points="140,150 170,167 170,201 140,218 110,201 110,167"/>
    <polygon points="260,130 290,147 290,181 260,198 230,181 230,147"/>
    <polygon points="380,150 410,167 410,201 380,218 350,201 350,167"/>
    <polygon points="500,130 530,147 530,181 500,198 470,181 470,147"/>
    <polygon points="620,150 650,167 650,201 620,218 590,201 590,167"/>
    <polygon points="740,130 770,147 770,181 740,198 710,181 710,147"/>
    <polygon points="860,150 890,167 890,201 860,218 830,201 830,167"/>
  </g>

  <!-- Logo hexagon (large) -->
  <g transform="translate(120, 95)">
    <path fill="url(#brand)" fill-rule="evenodd" d="
      M64 10 L115 40 L115 90 L64 120 L13 90 L13 40 Z
      M50 50 a14 14 0 1 0 28 0 a14 14 0 1 0 -28 0 Z
      M58 62 L70 62 L68 88 L60 88 Z
    " filter="url(#glow)"/>
  </g>

  <!-- Title -->
  <text x="270" y="145" font-family="system-ui,-apple-system,sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
    <tspan fill="url(#brand-h)">Ferrum</tspan><tspan fill="#e2e8f0">KV</tspan>
  </text>

  <!-- Tagline -->
  <text x="270" y="185" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#94a3b8" font-weight="500">
    Eviction algorithm laboratory for RESP2-compatible KV stores
  </text>
  <text x="270" y="212" font-family="SF Mono,ui-monospace,monospace" font-size="13" fill="#64748b">
    16 eviction policies  ·  built-in web dashboard  ·  written in Rust
  </text>

  <!-- Separator line -->
  <line x1="270" y1="238" x2="820" y2="238" stroke="url(#brand-h)" stroke-width="1" opacity="0.3"/>

  <!-- Stat cards -->
  <g transform="translate(270, 262)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="130" height="64" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    <text x="65" y="26" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" fill="url(#brand-h)">16</text>
    <text x="65" y="48" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#94a3b8">Eviction Policies</text>

    <!-- Card 2 -->
    <rect x="142" y="0" width="130" height="64" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    <text x="207" y="26" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" fill="url(#brand-h)">RESP2</text>
    <text x="207" y="48" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#94a3b8">Wire Compatible</text>

    <!-- Card 3 -->
    <rect x="284" y="0" width="130" height="64" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    <text x="349" y="26" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" fill="url(#brand-h)">~8.5K</text>
    <text x="349" y="48" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#94a3b8">Lines of Rust</text>

    <!-- Card 4 -->
    <rect x="426" y="0" width="130" height="64" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    <text x="491" y="26" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" fill="url(#brand-h)">v0.5.3</text>
    <text x="491" y="48" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#94a3b8">Latest Release</text>
  </g>
</svg>
